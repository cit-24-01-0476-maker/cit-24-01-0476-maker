<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="150" viewBox="0 0 1600 150" role="img" aria-label="Development pipeline: Plan, Code, Build, Deploy, Monitor"><style>text{font-family:Consolas,monospace}.flow{stroke-dasharray:10 12;animation:flow 3s linear infinite}@keyframes flow{to{stroke-dashoffset:-132}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect width="1600" height="150" rx="22" fill="#0b0f18"/><path d="M140 65H1460" stroke="#233349" stroke-width="3"/><path class="flow" d="M140 65H1460" stroke="#22d3ee" stroke-width="2"/><circle cx="140" cy="65" r="20" fill="#0e1e2e" stroke="#22d3ee"/><text x="140" y="72" text-anchor="middle" fill="#a5f3fc" font-size="18">1</text><text x="140" y="119" text-anchor="middle" fill="#a5b4fc" font-size="17" letter-spacing="3">PLAN</text><circle cx="470" cy="65" r="20" fill="#0e1e2e" stroke="#22d3ee"/><text x="470" y="72" text-anchor="middle" fill="#a5f3fc" font-size="18">2</text><text x="470" y="119" text-anchor="middle" fill="#a5b4fc" font-size="17" letter-spacing="3">CODE</text><circle cx="800" cy="65" r="20" fill="#0e1e2e" stroke="#22d3ee"/><text x="800" y="72" text-anchor="middle" fill="#a5f3fc" font-size="18">3</text><text x="800" y="119" text-anchor="middle" fill="#a5b4fc" font-size="17" letter-spacing="3">BUILD</text><circle cx="1130" cy="65" r="20" fill="#0e1e2e" stroke="#22d3ee"/><text x="1130" y="72" text-anchor="middle" fill="#a5f3fc" font-size="18">4</text><text x="1130" y="119" text-anchor="middle" fill="#a5b4fc" font-size="17" letter-spacing="3">DEPLOY</text><circle cx="1460" cy="65" r="20" fill="#0e1e2e" stroke="#22d3ee"/><text x="1460" y="72" text-anchor="middle" fill="#a5f3fc" font-size="18">5</text><text x="1460" y="119" text-anchor="middle" fill="#a5b4fc" font-size="17" letter-spacing="3">MONITOR</text></svg>