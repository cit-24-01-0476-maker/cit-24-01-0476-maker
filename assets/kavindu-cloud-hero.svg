<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Kavindu Oshadha — Cloud and Full-Stack Engineer">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,-30px); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,30px); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes scan { from { transform: translateY(-900px); } to { transform: translateY(900px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -400; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .orbA { animation: drift 12s ease-in-out infinite; }
    .orbB { animation: drift2 14s ease-in-out infinite; }
    .scan { animation: scan 7s linear infinite; }
    .r1 { animation: rise .9s ease-out .2s both; }
    .r2 { animation: rise .9s ease-out .5s both; }
    .r3 { animation: rise .9s ease-out .8s both; }
    .r4 { animation: rise .9s ease-out 1.1s both; }
    .r5 { animation: rise .9s ease-out 1.4s both; }
    .l1 { animation: rise .4s ease-out 1.8s both; }
    .l2 { animation: rise .4s ease-out 2.4s both; }
    .l3 { animation: rise .4s ease-out 3.0s both; }
    .l4 { animation: rise .4s ease-out 3.6s both; }
    .l5 { animation: rise .4s ease-out 4.2s both; }
    .cursor { animation: blink 1s step-end infinite; }
    .live { animation: pulse 1.6s ease-in-out infinite; }
    .flow { stroke-dasharray: 6 10; animation: dash 6s linear infinite; }
    .ring { transform-origin: 1290px 250px; animation: spin 30s linear infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="1" stop-color="#0d1320"/>
    </linearGradient>
    <radialGradient id="glowO" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1600" height="900" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <rect width="1600" height="900" fill="url(#grid)"/>
    <circle class="orbA" cx="1250" cy="200" r="380" fill="url(#glowO)"/>
    <circle class="orbB" cx="260" cy="780" r="420" fill="url(#glowB)"/>
    <rect class="scan" width="1600" height="260" fill="url(#scanG)"/>

    <!-- Top bar -->
    <g class="mono r1" font-size="18" fill="#8b93a7">
      <circle cx="80" cy="70" r="7" fill="#22d3ee" class="live"/>
      <text x="100" y="76">OSHADHA.LIVE</text>
      <text x="1520" y="76" text-anchor="end">LK · UTC+05:30 · CLOUD / DEVOPS</text>
    </g>
    <line x1="64" y1="106" x2="1536" y2="106" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- Left: identity -->
    <g class="sans">
      <text class="mono r1" x="80" y="240" font-size="22" fill="#22d3ee" letter-spacing="6">// HELLO WORLD, I'M</text>
      <text class="r2" x="76" y="345" font-size="104" font-weight="800" fill="url(#title)" letter-spacing="-3">Kavindu</text>
      <text class="r2" x="76" y="450" font-size="104" font-weight="800" fill="url(#title)" letter-spacing="-3">Oshadha</text>
      <g class="r3">
        <rect x="80" y="490" width="6" height="64" rx="3" fill="#22d3ee"/>
        <text x="106" y="518" font-size="28" fill="#e6e9f0" font-weight="600">Cloud Computing Undergraduate</text>
        <text x="106" y="552" font-size="22" fill="#8b93a7">Cloud · DevOps · Networking · Web apps</text>
      </g>
      <!-- chips -->
      <g class="r4 mono" font-size="17">
        <rect x="80" y="600" width="250" height="44" rx="22" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/>
        <text x="205" y="628" text-anchor="middle" fill="#22d3ee">Cloud Computing</text>
        <rect x="344" y="600" width="170" height="44" rx="22" fill="#6366f1" fill-opacity=".12" stroke="#6366f1" stroke-opacity=".5"/>
        <text x="429" y="628" text-anchor="middle" fill="#a5b4fc">Azure · AWS</text>
        <rect x="528" y="600" width="150" height="44" rx="22" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".2"/>
        <text x="603" y="628" text-anchor="middle" fill="#e6e9f0">Next.js</text>
      </g>
      <g class="r5 mono" font-size="20" fill="#8b93a7">
        <text x="80" y="760"><tspan fill="#22d3ee">▸</tspan> Building cloud &amp; web projects</text>
        <text x="80" y="800"><tspan fill="#22d3ee">▸</tspan> Explore my work at oshadha.live</text>
      </g>
    </g>

    <!-- Right: orbit + terminal -->
    <g class="ring" opacity=".7">
      <circle cx="1290" cy="250" r="150" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-dasharray="2 14"/>
      <circle cx="1440" cy="250" r="7" fill="#22d3ee"/>
      <circle cx="1290" cy="100" r="5" fill="#a5b4fc"/>
    </g>
    <circle cx="1290" cy="250" r="96" fill="none" stroke="#a5b4fc" stroke-opacity=".25"/>
    <text x="1290" y="262" text-anchor="middle" class="mono" font-size="40" font-weight="700" fill="#ffffff">&lt;/&gt;</text>

    <g class="r3">
      <rect x="880" y="430" width="660" height="400" rx="22" fill="#0b0f18" fill-opacity=".92" stroke="#ffffff" stroke-opacity=".1"/>
      <rect x="880" y="430" width="660" height="54" rx="22" fill="#ffffff" fill-opacity=".04"/>
      <circle cx="914" cy="457" r="8" fill="#ff5f57"/>
      <circle cx="942" cy="457" r="8" fill="#febc2e"/>
      <circle cx="970" cy="457" r="8" fill="#28c840"/>
      <text x="1210" y="463" text-anchor="middle" class="mono" font-size="16" fill="#8b93a7">~/kavindu — zsh</text>

      <g class="mono" font-size="19">
        <g transform="translate(910 530)">
          <text fill="#28c840">$ <tspan fill="#e6e9f0">whoami</tspan></text>
        </g>
        <text class="l1" x="910" y="566" fill="#8b93a7">kavindu — exploring the web &amp; cloud</text>
        <text class="l2" x="910" y="610" fill="#28c840">$ <tspan fill="#e6e9f0">cat stack.json</tspan></text>
        <text class="l3" x="910" y="646" fill="#22d3ee">{ "web": ["Next.js","React","TypeScript"],</text>
        <text class="l3" x="910" y="676" fill="#22d3ee">  "cloud": ["AWS","Linux","Docker"],</text>
        <text class="l3" x="910" y="706" fill="#22d3ee">  "focus": ["DevOps","Networking"] }</text>
        <text class="l4" x="910" y="750" fill="#28c840">$ <tspan fill="#e6e9f0">./connect --let-us-build</tspan></text>
        <text class="l5" x="910" y="790" fill="#a5b4fc">&gt; ready to build · oshadha.live<tspan class="cursor" fill="#22d3ee"> ▍</tspan></text>
      </g>
    </g>

    <!-- connector -->
    <path class="flow" d="M1290 346 C1290 390 1210 400 1210 430" fill="none" stroke="#22d3ee" stroke-opacity=".6" stroke-width="2"/>

    <rect x="1" y="1" width="1598" height="898" rx="36" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  </g>
</svg>
